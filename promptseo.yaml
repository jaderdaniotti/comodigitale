final_instruction:
  text: >
    Non limitarti a inserire meta tag.
    Ragiona sull'intero sito come su un'architettura SEO.

    L'obiettivo è fare in modo che Google possa comprendere chiaramente:
    1. chi è Comodigitale,
    2. dove opera,
    3. quali servizi offre,
    4. per quali tipologie di attività offre tali servizi,
    5. quali problemi risolve,
    6. quali pagine sono più importanti,
    7. quali pagine sono correlate tra loro.

    Ogni modifica deve essere tecnicamente corretta, naturale per l'utente
    e coerente con Next.js.

    NON ottimizzare il sito per un algoritmo immaginario.
    Ottimizzalo per utenti reali e per una corretta comprensione da parte
    dei motori di ricerca.

    Prima analizza.
    Poi pianifica.
    Poi implementa.
    Infine verifica e produci un report dettagliato.
Una cosa importante prima di lanciarlo in Cursor
Io non farei eseguire subito tutto in modalità "agent" senza controllo.
Gli darei prima questo prompt e gli direi di fare la fase di analisi senza modificare file. Dopo che ti restituisce l'audit, puoi farmelo vedere e possiamo controllare insieme se sta interpretando correttamente la struttura del tuo progetto.
Poi gli fai eseguire l'implementazione.
Il motivo è semplice: il prompt contiene una strategia SEO molto ampia, ma Cursor conosce il codice reale del tuo progetto, mentre io conosco la strategia che vogliamo applicare. Il passaggio migliore è quindi:
Cursor → audit del codice → noi controlliamo → Cursor implementa.
E soprattutto, per le 19 pagine /servizi/[slug], non mi affiderei a metadata generati genericamente. Voglio che ogni servizio abbia un'intenzione di ricerca precisa, perché è proprio lì che puoi costruire il vantaggio competitivo SEO di Comodigitale.