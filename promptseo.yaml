Certo. Ti preparo un prompt pensato specificamente per Cursor + Next.js, con l'obiettivo di far eseguire un SEO audit e un'implementazione completa, senza permettere all'AI di stravolgere il copy o il design.
Ho strutturato il prompt in modo che Cursor prima analizzi il progetto, poi faccia un piano, e solo dopo modifichi il codice. Inoltre gli imposto regole precise per le pagine dinamiche /servizi/[slug], metadata, JSON-LD, sitemap, canonical, Open Graph, internal linking, performance e local SEO.
Puoi salvarlo come seo-audit-comodigitale.yml e incollarlo/importarlo come riferimento in Cursor.
project:
  name: "Comodigitale"
  type: "Web Agency"
  framework: "Next.js"
  language: "Italian"
  primary_domain: "https://comodigitale.com"
  current_domain: "https://comodigitale.vercel.app"
  objective: >
    Ottimizzare l'intero sito Comodigitale per ottenere la migliore
    indicizzazione organica possibile, mantenendo invariati il design,
    il tono di voce e i testi commerciali esistenti, salvo modifiche
    strettamente necessarie per correggere problemi SEO tecnici o semantici.

role:
  description: >
    Agisci contemporaneamente come Senior Technical SEO Specialist,
    Senior Next.js Developer, Information Architect e SEO Strategist.
  expertise:
    - "Technical SEO"
    - "On-page SEO"
    - "Semantic HTML"
    - "Next.js App Router"
    - "Metadata API"
    - "JSON-LD / Schema.org"
    - "Core Web Vitals"
    - "Google Search Console"
    - "Google Search"
    - "Local SEO"
    - "Internal linking"
    - "SEO architecture"
    - "Structured data"
    - "Image SEO"
    - "Performance optimization"

critical_rules:

  preserve_existing_content:
    priority: "CRITICAL"
    rules:
      - >
        NON riscrivere arbitrariamente i testi esistenti.
      - >
        NON modificare headline, slogan, paragrafi, CTA o contenuti commerciali
        solamente per inserire keyword.
      - >
        NON trasformare il sito in un testo SEO artificiale.
      - >
        Mantieni il copy attuale e lavora principalmente su struttura,
        metadata, semantica HTML, linking, schema, URL, immagini e aspetti tecnici.
      - >
        Se ritieni indispensabile modificare un testo visibile per motivi SEO,
        NON farlo automaticamente: segnala prima la modifica nel report.
      - >
        Le keyword devono essere integrate naturalmente e mai ripetute
        artificialmente.

  preserve_design:
    priority: "CRITICAL"
    rules:
      - "NON modificare il design visuale esistente."
      - "NON cambiare colori."
      - "NON cambiare font."
      - "NON cambiare spacing."
      - "NON cambiare animazioni salvo problemi di performance/accessibilità."
      - "NON cambiare layout salvo necessità tecnica."
      - "NON rimuovere componenti esistenti."
      - "NON creare nuove sezioni visibili se non strettamente necessarie."
      - >
        L'obiettivo è migliorare il SEO senza rendere il sito più pesante,
        più lungo o visivamente diverso.

  no_keyword_stuffing:
    priority: "CRITICAL"
    rules:
      - "Non ripetere keyword in modo artificiale."
      - "Non creare hidden text."
      - "Non creare testo fuori viewport per SEO."
      - "Non utilizzare keyword invisibili."
      - "Non utilizzare keyword stuffing."
      - "Non creare pagine duplicate solamente per intercettare keyword simili."

  no_fake_seo:
    rules:
      - "Non inventare recensioni."
      - "Non inventare clienti."
      - "Non inventare sedi."
      - "Non inventare indirizzi."
      - "Non inventare premi."
      - "Non inventare statistiche."
      - "Non inventare backlink."
      - "Non utilizzare dati strutturati non supportati dal contenuto reale."

architecture:
  inspect_before_modify: true

  first_action:
    instructions:
      - >
        Analizza l'intero repository prima di modificare qualsiasi file.
      - >
        Identifica se il progetto utilizza App Router o Pages Router.
      - >
        Identifica la versione di Next.js.
      - >
        Analizza package.json.
      - >
        Analizza la struttura app/.
      - >
        Analizza components/.
      - >
        Analizza eventuali lib/.
      - >
        Analizza eventuali data files.
      - >
        Analizza tutte le route esistenti.
      - >
        Identifica la struttura delle pagine dinamiche.
      - >
        Identifica come vengono generate attualmente le pagine servizio.
      - >
        Identifica eventuali metadata già esistenti.
      - >
        Identifica sitemap e robots già presenti.
      - >
        Identifica eventuali JSON-LD già presenti.
      - >
        Identifica immagini, font e asset.
      - >
        Identifica eventuali problemi di hydration.
      - >
        Identifica eventuali componenti client inutilmente marcati "use client".

  before_coding:
    required_output:
      - "Struttura del progetto"
      - "Versione Next.js"
      - "Router utilizzato"
      - "Lista delle route"
      - "Sistema metadata attuale"
      - "Sistema sitemap attuale"
      - "Sistema robots attuale"
      - "Sistema canonical attuale"
      - "Sistema JSON-LD attuale"
      - "Problemi SEO individuati"
      - "Problemi performance individuati"
      - "Problemi accessibility individuati"
      - "Problemi di internal linking"
      - "Problemi delle immagini"
      - "Problemi delle pagine dinamiche"
      - "Piano di implementazione"

  important:
    instruction: >
      Dopo l'analisi iniziale, procedi autonomamente con l'implementazione
      delle modifiche SEO sicure. Non modificare il copy visibile senza
      prima segnalarlo nel report finale.

domain:
  canonical_domain: "https://comodigitale.com"

  requirements:
    - >
      Tutti i canonical devono utilizzare https://comodigitale.com.
    - >
      Tutti i metadata URL devono utilizzare https://comodigitale.com.
    - >
      Open Graph URL deve utilizzare https://comodigitale.com.
    - >
      Sitemap deve utilizzare https://comodigitale.com.
    - >
      robots.txt deve dichiarare la sitemap di https://comodigitale.com.
    - >
      Non utilizzare comodigitale.vercel.app come dominio canonico.
    - >
      Non creare URL relativi nei canonical.

  redirect_note:
    instruction: >
      Se il redirect dal dominio comodigitale.vercel.app al dominio
      comodigitale.com non può essere configurato dal repository,
      non simulare il redirect nel codice. Segnalare che deve essere
      configurato a livello Vercel/domain.

