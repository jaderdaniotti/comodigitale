    - "Non compromettere CSP o security headers esistenti."

nextjs:
  requirements:
    - >
      Utilizzare correttamente l'App Router se il progetto lo utilizza.
    - >
      Preferire generateMetadata() per route dinamiche.
    - >
      Utilizzare metadataBase.
    - >
      Utilizzare app/sitemap.ts quando appropriato.
    - >
      Utilizzare app/robots.ts quando appropriato.
    - >
      Utilizzare Server Components quando possibile.
    - >
      Evitare "use client" non necessario.
    - >
      Non duplicare metadata statici e dinamici.
    - >
      Non generare sitemap manualmente se Next.js può generarlo.
    - >
      Utilizzare generateStaticParams() se i servizi sono statici e compatibile
      con l'architettura esistente.
    - >
      Non modificare inutilmente l'architettura del progetto.

