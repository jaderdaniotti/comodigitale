metadata:
  implementation:
    preferred:
      - "Next.js Metadata API"
      - "generateMetadata() per pagine dinamiche"
      - "metadataBase"

  metadata_base:
    value: "https://comodigitale.com"

  requirements:
    every_indexable_page:
      - "title unico"
      - "description unica"
      - "canonical unico"
      - "Open Graph"
      - "Twitter/X card"
      - "og:image"
      - "og:url"
      - "og:type"
      - "og:site_name"

    rules:
      - >
        Non utilizzare lo stesso title su più pagine.
      - >
        Non utilizzare la stessa description su più pagine.
      - >
        Evitare title generici come "Home", "Servizi", "Pagina".
      - >
        Evitare keyword stuffing.
      - >
        Il brand Comodigitale deve essere presente quando utile,
        senza rendere i title inutilmente lunghi.

  homepage:
    title: "Web Agency a Como | Siti Web, E-commerce e Soluzioni Digitali"
    description: >
      Comodigitale è una web agency a Como specializzata in siti web,
      e-commerce, sviluppo su misura e soluzioni digitali per aziende e professionisti.

  services_index:
    title: "Servizi Web e Soluzioni Digitali | Comodigitale"
    description: >
      Scopri i servizi web di Comodigitale: siti per attività e professionisti,
      e-commerce, sistemi di prenotazione, automazioni, configuratori e soluzioni digitali su misura.

  why_us:
