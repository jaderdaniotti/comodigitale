service_metadata:
  rules:
    - >
      Ogni pagina servizio deve utilizzare generateMetadata().
    - >
      Title e description devono essere generati dinamicamente dai dati del servizio.
    - >
      Non usare metadata identici tra servizi.
    - >
      La keyword primaria deve essere coerente con l'intento della pagina.
    - >
      Non inserire tutte le secondary keywords nel title.
    - >
      Non creare title innaturali.
    - >
      La description deve descrivere realmente il servizio.
    - >
      Il canonical deve puntare all'URL definitivo del servizio.

  recommended_title_pattern: >
    {Primary Keyword} | {Specific Value Proposition} | Comodigitale

  fallback_title_pattern: >
    {Primary Keyword} | Comodigitale

  recommended_description_pattern: >
    {Descrizione naturale del servizio con 1-2 concetti secondari rilevanti}.

semantic_html:
  requirements:
    - "Una sola H1 per pagina."
    - "H2 per le sezioni principali."
    - "H3 per eventuali sottosezioni."
    - "Non usare heading solo per ottenere dimensioni grafiche."
    - "Usare nav, main, header, footer, section, article quando semanticamente appropriato."
    - "CTA devono essere veri link o button."
    - "Link interni devono essere elementi <a> crawlable."
    - "Non affidarsi esclusivamente a onClick per la navigazione."

  h1_rules:
    important: >
      NON sostituire gli H1 commerciali esistenti solo per inserire keyword.
      Se l'H1 attuale è semanticamente valido, conservarlo.

internal_linking:
  priority: "HIGH"

  requirements:
    - >
      Ogni pagina servizio deve essere raggiungibile dalla pagina /servizi.
    - >
      Ogni pagina servizio deve contenere link verso servizi correlati.
    - >
      Utilizzare anchor text descrittivi.
    - >
      Evitare anchor generici come "clicca qui".
    - >
      Creare una rete semantica tra servizi.
    - >
      La homepage deve linkare alle aree principali del sito.
    - >
      /servizi deve linkare a tutti i servizi indicizzabili.
    - >
      /portfolio deve linkare ai singoli case study quando disponibili.
    - >
      I case study devono linkare ai servizi utilizzati nel progetto.
    - >
      /contatti deve essere raggiungibile facilmente dalle pagine commerciali.

  example:
    restaurant:
      related_services:
        - "/servizi/portali-prenotazione"
        - "/servizi/landing-page"
        - "/servizi/digitalizzazione-aziendale"

    wedding:
      related_services:
        - "/servizi/eventi-privati"
        - "/servizi/portali-prenotazione"
        - "/servizi/portfolio-cv-online"

breadcrumbs:
  enabled: true

  structure:
    - "Home"
    - "Servizi"
    - "{Nome servizio}"

  implementation:
    - "UI breadcrumb visibile e discreta"
    - "Schema.org BreadcrumbList"
    - "URL coerenti con la struttura"

structured_data:
  priority: "HIGH"

  global:
    type: "Organization"

    fields:
      - "name"
      - "url"
      - "logo"
      - "email"
      - "telephone"
      - "sameAs"

  homepage:
    preferred_types:
      - "Organization"
      - "WebSite"

  service_pages:
    type: "Service"

    required:
      - "name"
      - "description"
      - "provider"
      - "url"

    provider:
      type: "Organization"
      name: "Comodigitale"

  breadcrumbs:
    type: "BreadcrumbList"

  rules:
    - >
      JSON-LD deve rappresentare esclusivamente contenuti realmente presenti nella pagina.
    - >
      Non aggiungere recensioni o rating inesistenti.
    - >
      Non utilizzare dati strutturati falsi.
    - >
      Evitare duplicazione inutile di JSON-LD.
    - >
      Validare JSON-LD sintatticamente.

images:
  requirements:
    - >
      Analizza tutte le immagini del progetto.
    - >
      Identifica immagini prive di alt quando l'alt è necessario.
    - >
      Sostituisci alt generici come "Image" quando l'immagine è informativa.
    - >
      Mantieni alt vuoto per immagini puramente decorative.
    - >
      Non inserire keyword artificiali negli alt.
    - >
      Usa descrizioni naturali e specifiche.
    - >
      Verifica width e height.
    - >
      Utilizza Next/Image quando appropriato.
    - >
      Verifica lazy loading.
    - >
      Evita immagini enormi inutilmente.
    - >
      Preferire WebP/AVIF quando compatibile con il progetto.

  examples:
    good:
      - "Sito web per matrimonio realizzato da Comodigitale"
      - "Homepage del sito Como Private Driver"
      - "Design responsive di un sito web per ristorante"

    bad:
      - "image"
      - "foto"
      - "seo"
      - "web agency como sito matrimonio sito web"

performance:
  priority: "HIGH"

  objectives:
    - "Ottimizzare LCP."
    - "Ottimizzare INP."
    - "Ridurre CLS."
    - "Ridurre JavaScript inutilizzato."
    - "Ridurre bundle non necessari."
    - "Ottimizzare immagini."
    - "Ottimizzare font."
    - "Ridurre client components inutili."
    - "Evitare hydration non necessaria."
    - "Utilizzare Server Components quando appropriato."
    - "Mantenere animazioni e design esistenti salvo problemi reali."

  do_not:
    - "Non eliminare animazioni solo perché esistono."
    - "Non convertire indiscriminatamente tutto in Server Components."
    - "Non introdurre librerie pesanti per semplici funzioni."
    - "Non introdurre plugin SEO inutili."

robots:
  file: "/app/robots.ts"

  requirements:
    user_agent: "*"
    allow: "/"
    sitemap: "https://comodigitale.com/sitemap.xml"

  do_not_block:
    - "/"
    - "/servizi"
    - "/servizi/*"
    - "/portfolio"
    - "/processo"
    - "/perche-noi"
    - "/chi-siamo"
    - "/contatti"

sitemap:
  file: "/app/sitemap.ts"

  requirements:
    include:
      - "/"
      - "/servizi"
      - "/portfolio"
      - "/processo"
      - "/perche-noi"
      - "/chi-siamo"
      - "/contatti"
      - "all indexable service pages"
      - "all indexable portfolio/case study pages"

    exclude:
      - "404"
      - "error"
      - "private routes"
      - "admin routes"
      - "preview-only routes"
      - "non-indexable technical routes"

  rules:
    - "Non creare URL duplicate."
    - "Non inserire URL canonical non esistenti."
    - "Utilizzare URL assoluti basati su https://comodigitale.com."

indexation:
  requirements:
    indexable:
      - "Homepage"
      - "Services"
      - "Service detail pages"
      - "Portfolio"
      - "Portfolio detail pages"
      - "Process"
      - "Why us"
      - "About"
      - "Contact"

    noindex_candidates:
      - "Preview routes"
      - "Internal test pages"
      - "Development pages"
      - "Duplicate utility pages"

  rule: >
    Non applicare noindex a una pagina semplicemente perché ha poco testo.
    Valutare prima il valore SEO e l'intento della pagina.

open_graph:
  global:
    site_name: "Comodigitale"
    type: "website"
    locale: "it_IT"

  requirements:
    - "Ogni pagina importante deve avere immagine OG coerente."
    - "OG image deve essere assoluta."
    - "OG image deve esistere realmente."
    - "Utilizzare immagini specifiche per servizi quando possibile."
    - "Non usare un'immagine rotta."
    - "Non generare dinamicamente immagini enormi inutilmente."

local_seo:
  primary_location:
    city: "Como"
    region: "Lombardia"
    country: "Italia"

  rules:
    - >
      Utilizzare Como e Lombardia naturalmente nei metadata e nelle pagine
      dove è realmente pertinente.
    - >
      Non aggiungere keyword geografiche artificialmente in ogni paragrafo.
    - >
      Non creare pagine locali duplicate solo cambiando la città.
    - >
      Preparare il sito per Google Business Profile.
    - >
      Mantenere coerenza di nome, indirizzo, telefono e dominio se presenti.

google_business_profile:
  note: >
    Non creare o modificare il profilo Google Business Profile dal codice.
    Preparare esclusivamente il sito per una corretta local SEO.

technical_checks:
  inspect:
    - "404 handling"
    - "redirects"
    - "canonical"
    - "duplicate URLs"
    - "trailing slash consistency"
    - "http/https"
    - "www/non-www consistency"
    - "metadata duplication"
    - "missing metadata"
